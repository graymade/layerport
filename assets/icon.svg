<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Layerport mark: a layer plane passing through a portal ring.
       Left crossing: plane in front, ring cut with a clearance gap.
       Right crossing: ring in front, plane cut with a wider clearance gap. -->
  <defs>
    <linearGradient id="lp-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B5BF6"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <clipPath id="lp-left"><rect x="0" y="0" width="64" height="128"/></clipPath>
    <clipPath id="lp-right"><rect x="64" y="0" width="64" height="128"/></clipPath>
    <mask id="lp-ring-mask">
      <rect width="128" height="128" fill="#fff"/>
      <g clip-path="url(#lp-left)">
        <polygon points="8,64 64,49 120,64 64,79" fill="#000"/>
        <polygon points="8,64 64,49 120,64 64,79" transform="translate(0,5)" fill="#000"/>
      </g>
    </mask>
    <mask id="lp-plane-mask">
      <rect width="128" height="128" fill="#fff"/>
      <g clip-path="url(#lp-right)">
        <ellipse cx="64" cy="64" rx="24" ry="42" fill="none" stroke="#000" stroke-width="15"/>
      </g>
    </mask>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#lp-bg)"/>
  <ellipse cx="64" cy="64" rx="24" ry="42" fill="none" stroke="#fff" stroke-width="9" mask="url(#lp-ring-mask)"/>
  <polygon points="8,64 64,49 120,64 64,79" fill="#fff" mask="url(#lp-plane-mask)"/>
</svg>
